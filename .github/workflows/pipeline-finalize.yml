name: Pipeline — Finalize

on:
  workflow_dispatch:
  schedule:
    # Niedziela 12:00 czasu polskiego (CEST) = 10:00 UTC
    # Co 4 tygodnie od 2026-10-05 (bramka CYCLE 28 dni)
    - cron: "0 10 * * 0"

jobs:
  gate:
    uses: ./.github/workflows/pipeline-gate.yml

  finalize:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      PIPELINE_STAGE: finalize
      MAX_RUNTIME_SECONDS: "14400"
      ENABLE_CLAUDE_RECORD_NORMALIZE: "true"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SEND_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            neueroeffnung_contact_batch.json
            neueroeffnung_claude_records.json
            neueroeffnung_processed.json
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-${{ github.ref_name }}-

      - name: Restore pipeline state from artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore_pipeline_state.sh .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finalize
        run: python neueroeffnung_scraper.py

      - name: Install Drive dependencies
        if: hashFiles('neueroeffnung_wynik.xlsx') != ''
        run: pip install -r requirements-drive.txt

      - name: Upload Excel to Google Drive
        if: success() && hashFiles('neueroeffnung_wynik.xlsx') != ''
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/gdrive_upload.py

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neueroeffnung-wynik
          path: |
            neueroeffnung_wynik.xlsx
            neueroeffnung_wynik.json
            neueroeffnung_raport_brakow.json
            neueroeffnung_staging.json
            neueroeffnung_claude_records.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore

      - name: Upload unified pipeline-state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            neueroeffnung_staging.json
            neueroeffnung_processed.json
            neueroeffnung_contact_batch.json
            neueroeffnung_claude_records.json
          if-no-files-found: ignore
