name: Pipeline — Maps

on:
  workflow_dispatch:
  schedule:
    # Pon–Pt 22:00 czasu polskiego (CEST) = 20:00 UTC
    - cron: "0 20 * * 1-5"

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PIPELINE_STAGE: maps
      MAX_RUNTIME_SECONDS: "14400"
      MAPS_BATCH_LIMIT: "200"
      ENABLE_GOOGLE_MAPS_ENRICHMENT: "true"
      GOOGLE_MAPS_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            neueroeffnung_staging.json
            neueroeffnung_maps_cache.json
            neueroeffnung_processed.json
          key: pipeline-${{ github.ref_name }}-${{ hashFiles('neueroeffnung_staging.json', 'neueroeffnung_maps_cache.json') }}
          restore-keys: |
            pipeline-${{ github.ref_name }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run maps enrichment
        run: python neueroeffnung_scraper.py

      - name: Upload staging artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-staging-maps
          path: |
            neueroeffnung_staging.json
            neueroeffnung_maps_cache.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore
