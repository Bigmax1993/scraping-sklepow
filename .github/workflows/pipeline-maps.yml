name: Pipeline — Maps

on:
  workflow_dispatch:
  schedule:
    # Pon–Pt 22:00 czasu polskiego (CEST) = 20:00 UTC
    # Co 4 tygodnie od 2026-10-05 (bramka CYCLE 28 dni)
    - cron: "0 20 * * 1-5"

jobs:
  gate:
    uses: ./.github/workflows/pipeline-gate.yml

  maps:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      PIPELINE_STAGE: maps
      MAX_RUNTIME_SECONDS: "14400"
      MAPS_BATCH_LIMIT: "200"
      ENABLE_GOOGLE_MAPS_ENRICHMENT: "true"
      GOOGLE_MAPS_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            neueroeffnung_maps_cache.json
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-${{ github.ref_name }}-

      - name: Restore pipeline state from artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore_pipeline_state.sh .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run maps enrichment
        run: python neueroeffnung_scraper.py

      - name: Upload staging artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-staging-maps
          path: |
            neueroeffnung_staging.json
            neueroeffnung_maps_cache.json
            neueroeffnung_processed.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore

      - name: Upload unified pipeline-state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            neueroeffnung_staging.json
            neueroeffnung_maps_cache.json
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
          if-no-files-found: ignore
