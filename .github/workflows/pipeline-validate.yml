name: Pipeline — Validate

on:
  workflow_dispatch:
  schedule:
    # Codziennie 08:30 czasu polskiego (CEST) = 06:30 UTC
    # Aktywne od PIPELINE_START_DATE (2026-09-03)
    - cron: "30 6 * * *"

jobs:
  gate:
    uses: ./.github/workflows/pipeline-gate.yml

  validate:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      PIPELINE_STAGE: validate
      MAX_RUNTIME_SECONDS: "7200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-${{ github.ref_name }}-

      - name: Restore pipeline state from artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore_pipeline_state.sh .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validate
        run: python neueroeffnung_scraper.py

      - name: Upload staging artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-staging-validate
          path: |
            neueroeffnung_staging.json
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore

      - name: Upload unified pipeline-state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            neueroeffnung_staging.json
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
          if-no-files-found: ignore
