name: Pipeline — Validate

on:
  workflow_dispatch:
  schedule:
    # Codziennie 08:30 czasu polskiego (CEST) = 06:30 UTC
    - cron: "30 6 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIPELINE_STAGE: validate
      MAX_RUNTIME_SECONDS: "7200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            neueroeffnung_staging.json
            neueroeffnung_detail_cache.json
            neueroeffnung_processed.json
          key: pipeline-${{ github.ref_name }}-${{ hashFiles('neueroeffnung_staging.json', 'neueroeffnung_processed.json') }}
          restore-keys: |
            pipeline-${{ github.ref_name }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validate
        run: python neueroeffnung_scraper.py

      - name: Upload staging artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-staging-validate
          path: |
            neueroeffnung_staging.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore
