name: Run scraper (full)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    env:
      PIPELINE_STAGE: full
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SEND_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "false"
          ENABLE_CONTACT_ENRICHMENT: "false"
          ENABLE_CLAUDE_CONTACT_VERIFY: "false"
          ENABLE_CLAUDE_RECORD_NORMALIZE: "false"

      - name: Run scraper
        run: python neueroeffnung_scraper.py
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "true"
          GOOGLE_MAPS_HEADLESS: "true"
          ENABLE_CONTACT_ENRICHMENT: "true"
          ENABLE_CLAUDE_CONTACT_VERIFY: "true"
          ENABLE_CLAUDE_RECORD_NORMALIZE: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neueroeffnung-wynik
          path: |
            neueroeffnung_wynik.xlsx
            neueroeffnung_wynik.json
            neueroeffnung_raport_brakow.json
            neueroeffnung_contact_batch.json
            neueroeffnung_claude_records.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore
