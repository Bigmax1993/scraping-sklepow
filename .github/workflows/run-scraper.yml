name: Run scraper

on:
  workflow_dispatch:
  schedule:
    # Niedziela 04:30 czasu polskiego (CEST, UTC+2) = 02:30 UTC
    # Po przejściu na CET (UTC+1) uruchomi się o 03:30 UTC — wtedy zmień na: 30 3 * * 0
    - cron: "30 2 * * 0"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Max do następnego cronu = 7 dni (10080 min), ale GitHub-hosted runner cap = 72 h (4320 min)
    timeout-minutes: 4320
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SEND_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "false"
          ENABLE_CONTACT_ENRICHMENT: "false"
          ENABLE_CLAUDE_CONTACT_VERIFY: "false"
          ENABLE_CLAUDE_RECORD_NORMALIZE: "false"

      - name: Run scraper
        run: python neueroeffnung_scraper.py
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "true"
          GOOGLE_MAPS_HEADLESS: "true"
          ENABLE_CONTACT_ENRICHMENT: "true"
          ENABLE_CLAUDE_CONTACT_VERIFY: "true"
          ENABLE_CLAUDE_RECORD_NORMALIZE: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neueroeffnung-wynik
          path: |
            neueroeffnung_wynik.xlsx
            neueroeffnung_wynik.json
            neueroeffnung_raport_brakow.json
            neueroeffnung_contact_batch.json
            neueroeffnung_claude_records.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore
