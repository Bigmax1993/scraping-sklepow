name: Run scraper

on:
  workflow_dispatch:
  schedule:
    # Niedziela 23:30 czasu polskiego (CEST, UTC+2) = 21:30 UTC
    # Po przejściu na CET (UTC+1) uruchomi się o 22:30 w Polsce — wtedy zmień na: 30 22 * * 0
    - cron: "30 21 * * 0"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SEND_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "false"

      - name: Run scraper
        run: python neueroeffnung_scraper.py
        env:
          ENABLE_GOOGLE_MAPS_ENRICHMENT: "true"
          GOOGLE_MAPS_HEADLESS: "true"

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neueroeffnung-wynik
          path: |
            neueroeffnung_wynik.xlsx
            neueroeffnung_wynik.json
            neueroeffnung_raport_brakow.json
            neueroeffnung_scraper.log
          if-no-files-found: ignore
