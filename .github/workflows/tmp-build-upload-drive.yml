name: tmp-build-upload-drive

on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "GitHub Actions run ID z artefaktem pipeline-staging-discovery"
        required: true
        default: "34090527280"

jobs:
  build-upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-drive.txt

      - name: Download discovery staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/discovery-art
          gh run download "${{ inputs.discovery_run_id }}" \
            -R "${{ github.repository }}" \
            -n pipeline-staging-discovery \
            -D /tmp/discovery-art
          cp /tmp/discovery-art/neueroeffnung_staging.json ./neueroeffnung_staging.json
          if [ -f /tmp/discovery-art/neueroeffnung_detail_cache.json ]; then
            cp /tmp/discovery-art/neueroeffnung_detail_cache.json ./neueroeffnung_detail_cache.json
          fi
          ls -la neueroeffnung_staging.json

      - name: Build Excel from staging
        run: python scripts/build_excel_from_staging.py

      - name: Upload Excel to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/gdrive_upload.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: neueroeffnung-wynik-from-discovery
          path: |
            neueroeffnung_wynik.xlsx
            neueroeffnung_staging.json
          if-no-files-found: error
